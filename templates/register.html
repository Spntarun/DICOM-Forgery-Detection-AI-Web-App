{% extends "base.html" %}

{% block title %}Register - Forgery Detection AI{% endblock %}

{% block content %}
<div class="auth-container glassmorphism fade-in">
    <div class="auth-header">
        <i class="fa-solid fa-user-plus ai-icon"></i>
        <h2>Create Account</h2>
        <p class="subtitle">Join NeuroForge AI secure platform</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="input-group">
            <label for="username"><i class="fa-solid fa-user"></i> Full Name</label>
            <input type="text" id="username" name="username" required placeholder="Dr. John Doe">
        </div>

        <div class="input-group">
            <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
            <input type="email" id="email" name="email" required placeholder="name@domain.com">
        </div>
        
        <div class="input-group">
            <label for="password"><i class="fa-solid fa-key"></i> Password</label>
            <input type="password" id="password" name="password" required placeholder="Create a strong password">
        </div>

        <button type="submit" class="btn btn-primary btn-block glow-btn shadow-md">
            Register <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
    </form>
    
    <div class="auth-footer text-center mt-3">
        <p>Already have an account? <a href="{{ url_for('login') }}" class="text-gradient hover-und">Log In</a></p>
    </div>
</div>
{% endblock %}
